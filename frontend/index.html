<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Hub | Ecossistema Operacional</title>
  </head>
  <body class="antialiased selection:bg-primary/20 selection:text-primary">
    <script>
      (() => {
        const VALID = ["teal", "indigo", "cyan", "blue", "orchid"];
        // Migração de IDs pré-M3 — mesmo mapa de LEGACY_THEME_PRESET_MAP em theme.types.ts.
        const LEGACY = {
          "zinc-minimalist": "teal",
          "slate-cyan": "cyan",
          "github-dimmed": "blue",
          "contrast-safe-graphite": "orchid",
        };
        try {
          let preset = localStorage.getItem("app-theme-preset");
          if (preset && LEGACY[preset]) preset = LEGACY[preset];
          if (preset && VALID.indexOf(preset) !== -1 && preset !== "teal") {
            document.documentElement.setAttribute("data-theme", preset);
          }
        } catch (_error) {}
        try {
          const stored = localStorage.getItem("app-theme-contrast");
          const high =
            stored === "high" ||
            (stored !== "standard" &&
              window.matchMedia("(prefers-contrast: more)").matches);
          if (high) document.documentElement.setAttribute("data-contrast", "high");
        } catch (_error) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
